name: Release

# Tag-triggered release: builds the linux-x64 package on the Linux runner, the
# win-x64 package on the hosted Windows runner, and the osx-arm64 package on the
# hosted macOS runner, attaching all of them (plus per-platform checksums) to a
# GitHub release for the tag.
#
# The Windows/macOS jobs run after the Linux one so exactly one job creates the
# release; later invocations of action-gh-release just append their attachments.
# If a platform job fails, the release still exists with the other platforms'
# artifacts — build the missing package locally with RazorForge/scripts/package.ps1
# (or package.sh) from the workspace and attach it manually as a fallback.
#
# The Suflae repository's release workflow calls this one for its sf-v* tags, so
# both languages ship from one definition; the release lands in the repository
# that pushed the tag.
#
# Releases are created with the workflow's own GITHUB_TOKEN (contents: write);
# no PAT/RELEASE_TOKEN secret is needed.

on:
  push:
    tags:
      - 'v*'       # RazorForge release  (e.g. v0.4.0)
  workflow_call:   # Suflae release (sf-v* tags in the Suflae repository) — same artifacts, SF branding

permissions:
  contents: write

env:
  # See build.yaml: lets CMake 4.x configure a vendored subproject that declares
  # cmake_minimum_required < 3.5.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  release-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout the workspace
        uses: dj-lumiere/Anvila/.github/actions/checkout-workspace@master

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            autoconf \
            automake \
            libtool \
            python3 \
            curl \
            wget \
            ca-certificates \
            lsb-release \
            software-properties-common \
            gnupg \
            zip

      - name: Install LLVM 22 toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo ln -sf /usr/bin/clang-22 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/opt-22 /usr/local/bin/opt
          sudo ln -sf /usr/bin/llc-22 /usr/local/bin/llc
          sudo ln -sf /usr/bin/llvm-ar-22 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/lld-22 /usr/local/bin/lld
          sudo ln -sf /usr/bin/ld.lld-22 /usr/local/bin/ld.lld
          clang --version
          opt --version

      # The packaging step downloads the official LLVM release tarball (~1.8GB)
      # to bundle the self-contained toolchain — cache it between releases.
      - name: Cache packaging downloads
        uses: actions/cache@v4
        with:
          path: dist/_cache/*.tar.xz
          key: pkg-llvm-22.1.7-linux-x64

      - name: Build native libraries
        run: |
          cd Ingrid/native
          chmod +x build.sh
          export CC=clang
          export CXX=clang++
          export CFLAGS="-D_GNU_SOURCE -Wno-implicit-function-declaration"
          export CXXFLAGS="-D_GNU_SOURCE -Wno-implicit-function-declaration"
          ./build.sh

      - name: Resolve version and release branding
        run: bash RazorForge/scripts/resolve-release.sh

      - name: Package linux-x64
        run: |
          chmod +x RazorForge/scripts/package.sh
          # PKG_VERSION is the tag version for a RazorForge tag, and the csproj
          # builder version for a Suflae tag (an sf tag ships the same builder,
          # so its artifacts are named for the builder, not the sf-v0.1.0 tag —
          # which would otherwise collide with the existing v0.1.0 release name).
          VERSION="$PKG_VERSION" RazorForge/scripts/package.sh
          # Per-platform checksum names: all jobs attach to the same release,
          # and identical filenames would collide.
          mv dist/checksums.txt dist/checksums-linux-x64.txt

      - name: Create GitHub release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: ${{ env.RELEASE_NOTES }}
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/checksums-linux-x64.txt

  release-windows:
    runs-on: windows-latest
    # Run after the Linux job so exactly one job creates the release; this one
    # only appends its attachments.
    needs: release-linux

    steps:
      - name: Checkout the workspace
        uses: dj-lumiere/Anvila/.github/actions/checkout-workspace@master

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache LLVM 22 toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\llvm22
          key: llvm-22.1.7-win64

      - name: Download LLVM 22 toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.7/clang+llvm-22.1.7-x86_64-pc-windows-msvc.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed' }
          New-Item -ItemType Directory -Force C:\llvm22 | Out-Null
          tar -xf llvm.tar.xz -C C:\llvm22 --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'LLVM extract failed' }
          Remove-Item llvm.tar.xz

      - name: Install Ninja and put LLVM on PATH
        shell: pwsh
        run: |
          choco install ninja -y
          Add-Content $env:GITHUB_PATH 'C:\llvm22\bin'

      # The packaging step downloads llvm-mingw (~180MB) and extracts opt.exe
      # from the official LLVM tarball (~820MB) for the bundled toolchain —
      # cache the products so releases skip the big downloads.
      - name: Cache packaging downloads
        uses: actions/cache@v4
        with:
          path: |
            dist/_cache/llvm-mingw-*.zip
            dist/_cache/opt-*.exe
          key: pkg-llvm-mingw-20260602-win-x64

      - name: Resolve version and release branding
        shell: bash
        run: bash RazorForge/scripts/resolve-release.sh

      - name: Package win-x64
        shell: pwsh
        run: |
          # package.ps1 honors $env:VERSION; PKG_VERSION is resolved for both tag families.
          $env:VERSION = $env:PKG_VERSION
          pwsh -NoProfile -File RazorForge/scripts/package.ps1
          if ($LASTEXITCODE -ne 0) { throw "package.ps1 failed ($LASTEXITCODE)" }
          Move-Item dist/checksums.txt dist/checksums-win-x64.txt

      - name: Attach win-x64 artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: ${{ env.RELEASE_NOTES }}
          prerelease: true
          files: |
            dist/*.zip
            dist/checksums-win-x64.txt

  release-macos:
    runs-on: macos-15
    needs: release-linux

    steps:
      - name: Checkout the workspace
        uses: dj-lumiere/Anvila/.github/actions/checkout-workspace@master

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 22 toolchain
        run: |
          # `llvm` is the current stable (22.x as of 2026-06); keg-only, and
          # GITHUB_PATH entries are prepended, so this shadows Apple clang.
          brew install llvm ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Cache packaging downloads
        uses: actions/cache@v4
        with:
          path: dist/_cache/*.tar.xz
          key: pkg-llvm-22.1.7-osx-arm64

      - name: Build native libraries
        run: |
          cd Ingrid/native
          chmod +x build.sh
          export CC=clang
          export CXX=clang++
          ./build.sh

      - name: Resolve version and release branding
        run: bash RazorForge/scripts/resolve-release.sh

      - name: Package osx-arm64
        run: |
          chmod +x RazorForge/scripts/package.sh
          VERSION="$PKG_VERSION" RazorForge/scripts/package.sh
          mv dist/checksums.txt dist/checksums-osx-arm64.txt

      - name: Attach osx-arm64 artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: ${{ env.RELEASE_NOTES }}
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/checksums-osx-arm64.txt
