# The Rider to build against when `riderLocalPath` is not set. sinceBuild in build.gradle.kts is 262 (2026.2).
platformVersion=2026.2.3

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true
# The plugin runs on the Kotlin stdlib that Rider bundles.
kotlin.stdlib.default.dependency=false
